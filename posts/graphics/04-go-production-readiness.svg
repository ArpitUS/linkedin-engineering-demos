<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7ec8ff"/></marker></defs>
  <rect width="1200" height="630" fill="#071723"/><rect x="50" y="46" width="1100" height="538" rx="26" fill="#0d2939" stroke="#1c617f"/>
  <text x="95" y="115" fill="#ffffff" font-family="Arial" font-size="38" font-weight="700">A production Go service needs controlled failure</text><text x="95" y="156" fill="#a9cddd" font-family="Arial" font-size="20">Deadlines, backpressure, and shutdown turn overload into known behavior.</text>
  <rect x="95" y="235" width="290" height="190" rx="16" fill="#123b50"/><text x="125" y="280" fill="#d9f2ff" font-family="Arial" font-size="24" font-weight="700">Context deadline</text><text x="125" y="318" fill="#a9cddd" font-family="Arial" font-size="18">dependency stalls</text><path d="M125 360 H330" stroke="#7ec8ff" stroke-width="5"/><text x="125" y="402" fill="#7ec8ff" font-family="Arial" font-size="21" font-weight="700">cancel at 150 ms</text>
  <rect x="455" y="235" width="290" height="190" rx="16" fill="#123b50"/><text x="485" y="280" fill="#d9f2ff" font-family="Arial" font-size="24" font-weight="700">Bounded workers</text><text x="485" y="318" fill="#a9cddd" font-family="Arial" font-size="18">capacity = 1</text><rect x="485" y="346" width="70" height="44" rx="8" fill="#5aa9d6"/><rect x="570" y="346" width="70" height="44" rx="8" fill="#b74d35"/><text x="493" y="375" fill="#ffffff" font-family="Arial" font-size="16">work</text><text x="578" y="375" fill="#ffffff" font-family="Arial" font-size="16">busy</text><text x="485" y="412" fill="#7ec8ff" font-family="Arial" font-size="20" font-weight="700">fail fast, not forever</text>
  <rect x="815" y="235" width="290" height="190" rx="16" fill="#123b50"/><text x="845" y="280" fill="#d9f2ff" font-family="Arial" font-size="24" font-weight="700">Shutdown</text><text x="845" y="318" fill="#a9cddd" font-family="Arial" font-size="18">readiness becomes false</text><path d="M845 360 H1040" stroke="#7ec8ff" stroke-width="5" marker-end="url(#a)"/><text x="845" y="402" fill="#7ec8ff" font-family="Arial" font-size="20" font-weight="700">reject new work</text>
  <text x="95" y="530" fill="#ffffff" font-family="Arial" font-size="23" font-weight="700">Every unit of work needs a time limit, capacity limit, and observable rejection path.</text>
</svg>
