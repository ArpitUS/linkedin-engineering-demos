<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06181a"/>
      <stop offset="100%" stop-color="#0d2b2a"/>
    </linearGradient>
    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#133231"/>
      <stop offset="100%" stop-color="#0d2423"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg3)"/>
  <rect x="36" y="32" width="1128" height="566" rx="20" fill="url(#cardBg3)" stroke="#1f5c58" stroke-width="1.5"/>
  <text x="68" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Three Kubernetes Signals That Reveal a Bottleneck</text>
  <text x="68" y="108" fill="#99d5cf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">One metric is a symptom. Three correlated for 10 minutes is a pre-outage warning.</text>

  <g transform="translate(68,140)">
    <rect width="330" height="240" rx="14" fill="#123331" stroke="#2a7a75" stroke-width="1.5"/>
    <rect x="20" y="20" width="140" height="24" rx="6" fill="#134e4a"/>
    <text x="90" y="36" fill="#99f6e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1. LATENCY SIGNAL</text>
    <text x="20" y="75" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">p95 Rises, Traffic Flat</text>
    <text x="20" y="104" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">80ms → 780ms</text>
    <path d="M20 135 H300" stroke="#1f4d4a" stroke-width="1.5"/>
    <polyline points="20,185 60,180 100,182 140,170 180,165 220,140 260,125 295,110" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="214" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Capacity lost: DB pool, downstream, GC</text>
  </g>

  <g transform="translate(412,140)">
    <rect width="330" height="240" rx="14" fill="#123331" stroke="#2a7a75" stroke-width="1.5"/>
    <rect x="20" y="20" width="150" height="24" rx="6" fill="#134e4a"/>
    <text x="95" y="36" fill="#99f6e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2. PRESSURE SIGNAL</text>
    <text x="20" y="75" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">CPU Throttling + Restarts</text>
    <text x="20" y="104" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">12.4% throttled</text>
    <path d="M20 135 H300" stroke="#1f4d4a" stroke-width="1.5"/>
    <g transform="translate(20,145)">
      <rect x="0" y="30" width="38" height="30" rx="4" fill="#2a7a75"/>
      <rect x="48" y="22" width="38" height="38" rx="4" fill="#2a7a75"/>
      <rect x="96" y="12" width="38" height="48" rx="4" fill="#fbbf24"/>
      <rect x="144" y="0" width="38" height="60" rx="4" fill="#f87171"/>
      <rect x="192" y="0" width="38" height="60" rx="4" fill="#f87171"/>
    </g>
    <text x="20" y="214" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Kernel limiting work: limits too tight</text>
  </g>

  <g transform="translate(756,140)">
    <rect width="340" height="240" rx="14" fill="#123331" stroke="#2a7a75" stroke-width="1.5"/>
    <rect x="20" y="20" width="145" height="24" rx="6" fill="#134e4a"/>
    <text x="92" y="36" fill="#99f6e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3. BACKLOG SIGNAL</text>
    <text x="20" y="75" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Consumer Lag Keeps Growing</text>
    <text x="20" y="104" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">40 → 8,200 msgs</text>
    <path d="M20 135 H310" stroke="#1f4d4a" stroke-width="1.5"/>
    <g transform="translate(20,150)">
      <rect x="0" y="18" width="290" height="10" rx="5" fill="#1f4d4a"/>
      <rect x="0" y="18" width="210" height="10" rx="5" fill="#38bdf8"/>
      <circle cx="70" cy="23" r="9" fill="#38bdf8" stroke="#0d2423" stroke-width="2"/>
      <circle cx="140" cy="23" r="9" fill="#38bdf8" stroke="#0d2423" stroke-width="2"/>
      <circle cx="210" cy="23" r="9" fill="#fbbf24" stroke="#0d2423" stroke-width="2"/>
    </g>
    <text x="20" y="214" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Demand &gt; throughput: skew or slow dependency</text>
  </g>

  <rect x="68" y="416" width="1028" height="152" rx="14" fill="#0a1e1d" stroke="#0f766e" stroke-width="1.5"/>
  <text x="100" y="452" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">Correlation Rule: Alert Only When All Three Fire Together for 10m</text>
  <g transform="translate(100,474)">
    <circle cx="6" cy="6" r="5" fill="#14b8a6"/>
    <text x="22" y="10" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5"><tspan font-weight="700">Isolate, don't just scale:</tspan> lag alone could be partition skew — check DB pools, downstream latency, and CPU limits first.</text>
    <circle cx="6" cy="34" r="5" fill="#14b8a6"/>
    <text x="22" y="38" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5"><tspan font-weight="700">Prometheus pattern:</tspan> p95 &gt; 0.5s AND cpu_throttled &gt; 0.1 AND kafka_lag &gt; 1000 — tune to your baseline.</text>
    <circle cx="6" cy="62" r="5" fill="#14b8a6"/>
    <text x="22" y="66" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5"><tspan font-weight="700">Act before errors:</tspan> shed load, protect traffic, then find the constrained resource — not after 5xx spikes.</text>
  </g>
</svg>