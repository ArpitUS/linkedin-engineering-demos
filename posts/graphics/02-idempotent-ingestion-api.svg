<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a1a"/>
      <stop offset="100%" stop-color="#18112e"/>
    </linearGradient>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f163d"/>
      <stop offset="100%" stop-color="#150e2a"/>
    </linearGradient>
    
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#c084fc"/>
    </marker>
    <marker id="arrowGreen2" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrowOrange2" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#fb923c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg2)"/>
  
  <!-- Outer Frame -->
  <rect x="36" y="32" width="1128" height="566" rx="20" fill="url(#cardBg2)" stroke="#3b266b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="68" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Idempotency in High-Scale Ingestion APIs</text>
  <text x="68" y="108" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">One unique key guarantees one irreversible side-effect, turning ambiguous retries into deterministic responses.</text>

  <!-- Stage 1: Initial Request -->
  <g transform="translate(68, 140)">
    <rect width="330" height="240" rx="14" fill="#1e1638" stroke="#38256a" stroke-width="1.5"/>
    <rect x="20" y="20" width="120" height="24" rx="6" fill="#38256a"/>
    <text x="80" y="36" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1. FIRST ATTEMPT</text>
    
    <text x="20" y="75" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Client sends payload</text>
    <text x="20" y="100" fill="#a855f7" font-family="monospace" font-size="13">Header: Idempotency-Key: k-91</text>
    
    <path d="M20 125 H300" stroke="#2e1f54" stroke-width="1.5"/>
    
    <text x="20" y="152" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Key not found in DB</text>
    <text x="20" y="174" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Executes DB write / billing</text>
    <text x="20" y="196" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Stores key + receipt atomically</text>
    
    <rect x="20" y="206" width="120" height="22" rx="4" fill="#064e3b"/>
    <text x="80" y="221" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">HTTP 201 Created</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M410 260 H446" stroke="#c084fc" stroke-width="3" marker-end="url(#arrowPurple)"/>

  <!-- Stage 2: The Failure Condition -->
  <g transform="translate(460, 140)">
    <rect width="310" height="240" rx="14" fill="#241424" stroke="#701a35" stroke-width="1.5"/>
    <rect x="20" y="20" width="130" height="24" rx="6" fill="#581428"/>
    <text x="85" y="36" fill="#fecdd3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2. THE RETRY TRIGGER</text>
    
    <text x="20" y="75" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Gateway or Client Timeout</text>
    <text x="20" y="100" fill="#f87171" font-family="monospace" font-size="13">Status: Ambiguous state</text>
    
    <path d="M20 125 H280" stroke="#4c1220" stroke-width="1.5"/>
    
    <text x="20" y="152" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• 201 response lost on wire</text>
    <text x="20" y="174" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Client cannot know if DB wrote</text>
    <text x="20" y="196" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Automated retry triggered</text>
    
    <rect x="20" y="206" width="130" height="22" rx="4" fill="#450a0a"/>
    <text x="85" y="221" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Replay Key: k-91</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M782 260 H818" stroke="#fb923c" stroke-width="3" marker-end="url(#arrowOrange2)"/>

  <!-- Stage 3: The Idempotent Protection -->
  <g transform="translate(830, 140)">
    <rect width="300" height="240" rx="14" fill="#102324" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="20" y="20" width="130" height="24" rx="6" fill="#042f2e"/>
    <text x="85" y="36" fill="#99f6e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3. SAFE RESOLUTION</text>
    
    <text x="20" y="75" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Duplicate Key Detected</text>
    <text x="20" y="100" fill="#2dd4bf" font-family="monospace" font-size="13">Hit: k-91 already committed</text>
    
    <path d="M20 125 H270" stroke="#134e4a" stroke-width="1.5"/>
    
    <text x="20" y="152" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Skips execution entirely</text>
    <text x="20" y="174" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Returns saved receipt payload</text>
    <text x="20" y="196" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Irreversible DB writes: 1</text>
    
    <rect x="20" y="206" width="120" height="22" rx="4" fill="#064e3b"/>
    <text x="80" y="221" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">HTTP 200 OK</text>
  </g>

  <!-- Bottom Core Architectural Rule Banner -->
  <rect x="68" y="416" width="1062" height="152" rx="14" fill="#130e26" stroke="#4c1d95" stroke-width="1.5"/>
  
  <text x="100" y="452" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">3 Non-Negotiable Rules for Production Idempotency:</text>

  <g transform="translate(100, 474)">
    <circle cx="6" cy="6" r="5" fill="#a855f7"/>
    <text x="22" y="10" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5"><tspan font-weight="700">Database-Level Uniqueness:</tspan> In-memory caches fail on restarts and cannot coordinate across multi-pod replicas.</text>

    <circle cx="6" cy="34" r="5" fill="#a855f7"/>
    <text x="22" y="38" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5"><tspan font-weight="700">Save the Full Response:</tspan> Retries must receive the exact same body and receipt ID as the first request to avoid confusing clients.</text>

    <circle cx="6" cy="62" r="5" fill="#a855f7"/>
    <text x="22" y="66" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5"><tspan font-weight="700">Atomic Side Effects:</tspan> Insert the key and commit the business transaction in the same DB transaction to prevent half-state bugs.</text>
  </g>

</svg>