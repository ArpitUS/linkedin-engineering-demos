<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08121f"/>
      <stop offset="100%" stop-color="#0e1e33"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14263f"/>
      <stop offset="100%" stop-color="#0f1d30"/>
    </linearGradient>
    
    <!-- Markers -->
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#fb923c"/>
    </marker>
    <marker id="arrowRedLeft" markerWidth="10" markerHeight="10" refX="1" refY="3.5" orient="auto">
      <polygon points="8 0, 0 3.5, 8 7" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Outer Frame -->
  <rect x="36" y="32" width="1128" height="566" rx="20" fill="url(#cardBg)" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Header -->
  <text x="68" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Why Retries Create Duplicate Data in Telemetry Pipelines</text>
  <text x="68" y="108" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">At-least-once delivery guarantees arrival, but network drops turn retries into duplicate writes without deduplication.</text>

  <!-- Actor Columns: Producer vs Ingestion -->
  <!-- Producer Box -->
  <rect x="68" y="136" width="220" height="52" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="178" y="168" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Telemetry Producer</text>

  <!-- Ingestion API Box -->
  <rect x="912" y="136" width="220" height="52" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="1022" y="168" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Ingestion API &amp; Storage</text>

  <!-- Vertical Guidelines (Life lines) -->
  <line x1="178" y1="188" x2="178" y2="400" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="1022" y1="188" x2="1022" y2="400" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Flow 1: First send -->
  <line x1="188" y1="222" x2="1008" y2="222" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <rect x="475" y="202" width="250" height="28" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text x="600" y="221" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">1. Send Event (ID: evt-9f2, Val: 1)</text>

  <!-- DB Write on Ingestion -->
  <rect x="942" y="238" width="160" height="26" rx="5" fill="#1e3a5f"/>
  <text x="1022" y="255" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">DB commits event</text>

  <!-- Flow 2: ACK Lost (From Ingestion returning back toward Producer, dropped in transit) -->
  <line x1="1008" y1="290" x2="380" y2="290" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowRedLeft)"/>
  
  <!-- Dropped / Blocked marker badge -->
  <circle cx="480" cy="290" r="14" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="480" y="295" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" text-anchor="middle">✕</text>
  
  <!-- Label -->
  <rect x="525" y="276" width="270" height="28" rx="6" fill="#180c10" stroke="#f87171" stroke-width="1"/>
  <text x="660" y="295" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">2. ACK (200 OK) Lost in Transit</text>
  
  <rect x="100" y="277" width="156" height="26" rx="5" fill="#2d1515"/>
  <text x="178" y="294" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Timeout waiting for ACK</text>

  <!-- Flow 3: Producer Retries Same Event -->
  <line x1="188" y1="356" x2="1008" y2="356" stroke="#fb923c" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <rect x="460" y="336" width="280" height="28" rx="6" fill="#1f1308" stroke="#fb923c" stroke-width="1"/>
  <text x="600" y="355" fill="#fed7aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">3. Client Retry: Same Event (evt-9f2)</text>

  <!-- Divider -->
  <line x1="68" y1="416" x2="1132" y2="416" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Comparison Outcome Boxes at Bottom -->
  <!-- Left Outcome: Naive Ingestion -->
  <rect x="68" y="432" width="516" height="136" rx="12" fill="#1a0f14" stroke="#ef4444" stroke-width="1.2"/>
  <rect x="84" y="446" width="130" height="22" rx="4" fill="#450a0a"/>
  <text x="149" y="461" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">NAIVE PIPELINE</text>
  <text x="84" y="492" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">Blind Appends Without Deduplication</text>
  <text x="84" y="516" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5">• Treats retry request as a distinct new metric event</text>
  <text x="84" y="538" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5">• Stored Total: <tspan fill="#f87171" font-weight="700">2 events (Value = 2)</tspan> — False spikes &amp; corrupted billing</text>

  <!-- Right Outcome: Idempotent Ingestion -->
  <rect x="616" y="432" width="516" height="136" rx="12" fill="#0b1b17" stroke="#10b981" stroke-width="1.2"/>
  <rect x="632" y="446" width="150" height="22" rx="4" fill="#064e3b"/>
  <text x="707" y="461" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">IDEMPOTENT PIPELINE</text>
  <text x="632" y="492" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">Stable Event-ID Deduplication</text>
  <text x="632" y="516" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5">• Recognizes existing event ID <tspan fill="#38bdf8" font-family="monospace">evt-9f2</tspan> as already processed</text>
  <text x="632" y="538" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5">• Stored Total: <tspan fill="#34d399" font-weight="700">1 event (Value = 1)</tspan> — Data integrity guaranteed</text>

</svg>