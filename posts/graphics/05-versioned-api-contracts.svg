<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1008"/>
      <stop offset="100%" stop-color="#2b1a0c"/>
    </linearGradient>
    <linearGradient id="cardBg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a2411"/>
      <stop offset="100%" stop-color="#2a1a0d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg5)"/>
  <rect x="36" y="32" width="1128" height="566" rx="20" fill="url(#cardBg5)" stroke="#7a4a1c" stroke-width="1.5"/>

  <text x="68" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Evolve API Contracts Without Breaking Consumers</text>
  <text x="68" y="108" fill="#e3bd91" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Existing clients are part of the system you are changing. Versioning makes that work explicit.</text>

  <g transform="translate(68,140)">
    <rect width="330" height="240" rx="14" fill="#3a2411" stroke="#a16207" stroke-width="1.5"/>
    <rect x="20" y="20" width="150" height="24" rx="6" fill="#14532d"/>
    <text x="95" y="36" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1. ADDITIVE (SAFE)</text>
    <text x="20" y="75" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Same version, new fields</text>
    <text x="20" y="100" fill="#fcd34d" font-family="monospace" font-size="12">{ "id": "c-1", "name": "Ada" }</text>
    <path d="M20 118 H310" stroke="#5a3413" stroke-width="1.5"/>
    <text x="20" y="145" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Add optional fields only</text>
    <text x="20" y="167" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Never change an existing meaning</text>
    <text x="20" y="189" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Clients must ignore unknown fields</text>
    <rect x="20" y="206" width="160" height="22" rx="4" fill="#14532d"/>
    <text x="100" y="221" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">No client changes needed</text>
  </g>

  <g transform="translate(412,140)">
    <rect width="330" height="240" rx="14" fill="#3a2411" stroke="#a16207" stroke-width="1.5"/>
    <rect x="20" y="20" width="160" height="24" rx="6" fill="#450a0a"/>
    <text x="100" y="36" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2. BREAKING (NEW MAJOR)</text>
    <text x="20" y="75" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Semantics change</text>
    <text x="20" y="100" fill="#fca5a5" font-family="monospace" font-size="12">"name" becomes "full_name"</text>
    <path d="M20 118 H310" stroke="#5a3413" stroke-width="1.5"/>
    <text x="20" y="145" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Renames and removals</text>
    <text x="20" y="167" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Optional becomes required</text>
    <text x="20" y="189" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Pagination / enum reinterpretation</text>
    <rect x="20" y="206" width="170" height="22" rx="4" fill="#450a0a"/>
    <text x="105" y="221" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Requires migration + /v2</text>
  </g>

  <g transform="translate(756,140)">
    <rect width="340" height="240" rx="14" fill="#3a2411" stroke="#a16207" stroke-width="1.5"/>
    <rect x="20" y="20" width="160" height="24" rx="6" fill="#1e3a5f"/>
    <text x="100" y="36" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3. RETIREMENT (MEASURED)</text>
    <text x="20" y="75" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Remove only with evidence</text>
    <text x="20" y="100" fill="#93c5fd" font-family="monospace" font-size="11.5">X-Client-Version: v1 (4.2%)</text>
    <path d="M20 118 H310" stroke="#5a3413" stroke-width="1.5"/>
    <text x="20" y="145" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Publish the deprecation date</text>
    <text x="20" y="167" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Track usage per version and tenant</text>
    <text x="20" y="189" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Keep a contract test per version</text>
    <rect x="20" y="206" width="150" height="22" rx="4" fill="#1e3a5f"/>
    <text x="95" y="221" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Adoption, not a calendar</text>
  </g>

  <rect x="68" y="416" width="1028" height="152" rx="14" fill="#241508" stroke="#8a5a20" stroke-width="1.5"/>
  <text x="100" y="452" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700">Before Changing a Public Contract, Write These Down</text>
  <g transform="translate(100,474)">
    <circle cx="6" cy="6" r="5" fill="#f59e0b"/>
    <text x="22" y="10" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5"><tspan font-weight="700">Old behavior, new behavior:</tspan> if you cannot describe both in one sentence each, the change is not understood well enough to ship.</text>
    <circle cx="6" cy="34" r="5" fill="#f59e0b"/>
    <text x="22" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5"><tspan font-weight="700">Affected consumers and migration path:</tspan> who breaks, how they move, and what support they get.</text>
    <circle cx="6" cy="62" r="5" fill="#f59e0b"/>
    <text x="22" y="66" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5"><tspan font-weight="700">Removal gated on telemetry:</tspan> a /v2 route does not make an unplanned break safe.</text>
  </g>
</svg>