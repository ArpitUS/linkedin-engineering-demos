<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ffb86b"/></marker></defs>
  <rect width="1200" height="630" fill="#241307"/><rect x="50" y="46" width="1100" height="538" rx="26" fill="#3b210d" stroke="#82501e"/>
  <text x="95" y="115" fill="#ffffff" font-family="Arial" font-size="38" font-weight="700">Evolve contracts without breaking consumers</text><text x="95" y="156" fill="#e1c2a0" font-family="Arial" font-size="20">Additive fields preserve meaning. Breaking semantics require a migration path.</text>
  <rect x="95" y="225" width="355" height="230" rx="16" fill="#512f15"/><text x="125" y="272" fill="#ffe0bd" font-family="Arial" font-size="25" font-weight="700">V1: stable contract</text><text x="125" y="318" fill="#ffe0bd" font-family="monospace" font-size="20">{</text><text x="145" y="350" fill="#ffcf91" font-family="monospace" font-size="19">"id": "c-1",</text><text x="145" y="380" fill="#ffcf91" font-family="monospace" font-size="19">"name": "Ada"</text><text x="125" y="412" fill="#ffe0bd" font-family="monospace" font-size="20">}</text>
  <path d="M450 340 H565" stroke="#ffb86b" stroke-width="5" marker-end="url(#a)"/><text x="468" y="315" fill="#ffcf91" font-family="Arial" font-size="18">preserve fields</text>
  <rect x="575" y="225" width="355" height="230" rx="16" fill="#512f15"/><text x="605" y="272" fill="#ffe0bd" font-family="Arial" font-size="25" font-weight="700">V2: additive change</text><text x="605" y="318" fill="#ffe0bd" font-family="monospace" font-size="20">{ id, name,</text><text x="625" y="350" fill="#8ee1c0" font-family="monospace" font-size="19">"displayName": "Ada",</text><text x="625" y="380" fill="#8ee1c0" font-family="monospace" font-size="19">"tier": "pro" }</text><text x="605" y="420" fill="#8ee1c0" font-family="Arial" font-size="18">new fields are optional to clients</text>
  <rect x="975" y="250" width="130" height="180" rx="16" fill="#1f5a4a"/><text x="995" y="300" fill="#c9f7e4" font-family="Arial" font-size="20" font-weight="700">Contract</text><text x="995" y="330" fill="#c9f7e4" font-family="Arial" font-size="20" font-weight="700">tests</text><text x="995" y="385" fill="#8ee1c0" font-family="Arial" font-size="17">protect V1</text>
  <text x="95" y="535" fill="#ffffff" font-family="Arial" font-size="23" font-weight="700">Measure client adoption, publish the migration, then retire versions deliberately.</text>
</svg>
